<html lang="en"><head><meta charset="utf-8">
<title>The Last Slasher: Test Arena</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#14121f;--panel:#221d3b;--ink:#ece6ff;--dim:#9b93c4;--gold:#f2c744;--line:#3d3566;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#hud{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;padding:10px 14px;font-size:14px;color:var(--dim)}
#hud b{color:var(--ink);font-weight:700}
#spd,#gear{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
#stage{flex:1;min-height:0;padding:0 10px;position:relative}
#c3{display:none;image-rendering:pixelated}
#hc{display:block;position:absolute;left:14px;top:6px;width:224px;height:80px;object-fit:fill;pointer-events:none}
@media (pointer:coarse),(max-width:700px){#hc{width:112px;height:40px}}
canvas{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;display:block}

.opt:disabled{opacity:.5}
#toast{position:fixed;top:16%;left:50%;transform:translateX(-50%);background:var(--panel);border:2px solid var(--gold);color:var(--gold);font-weight:700;padding:10px 18px;border-radius:10px;z-index:4;display:none;pointer-events:none;text-align:center;max-width:90%}
.card p{margin:0;font-size:14px;color:var(--dim)}#opts{display:flex;flex-wrap:wrap;gap:8px}.opt,#sc{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}.opt.sel{background:var(--gold);color:#14121f;border-color:var(--gold);font-weight:700}
#pad #joy{display:none;position:relative;width:120px;height:120px;border-radius:50%;background:var(--panel);border:2px solid var(--line);touch-action:none}#pad #knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:var(--gold);opacity:.85;pointer-events:none}#pad.m3 #joy{display:block}#pad.m3 #bl,#pad.m3 #br{display:none}
#help{text-align:center;font-size:12px;color:var(--dim);padding:6px 10px}
#pad{display:flex;justify-content:space-between;align-items:center;padding:8px 16px 16px}
#pad div{display:flex;gap:12px}
.btn{width:76px;height:76px;border-radius:50%;border:2px solid var(--line);background:var(--panel);color:var(--ink);font:700 15px "Trebuchet MS",system-ui,sans-serif;touch-action:none}
.btn.on{background:var(--gold);color:#14121f;border-color:var(--gold)}
#bs{width:84px;height:84px}
@media (max-width:400px){.btn{width:58px;height:58px}#bs{width:66px;height:66px}#pad #joy{width:108px;height:108px}}
@media (max-height:420px){.btn{width:56px;height:56px}#bs{width:68px;height:68px}#pad #joy{width:88px;height:88px}#help{display:none}}
@media (orientation:landscape) and (max-height:500px){
#hud{position:fixed;top:max(6px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));z-index:3;padding:0}
#hud span{display:none}
#stage{position:fixed;inset:0;padding:0}
#hc{left:calc(14px + env(safe-area-inset-left,0px))}
#pad{position:fixed;left:0;right:0;bottom:0;z-index:3;padding:0 max(18px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));pointer-events:none}
#pad div{pointer-events:none}
#pad .btn,#pad #joy{pointer-events:auto}
.btn{width:60px;height:60px;background:rgba(34,29,59,.6)}
#bs{width:72px;height:72px}
#pad #joy{width:96px;height:96px;background:rgba(34,29,59,.5)}
}
